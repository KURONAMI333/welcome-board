org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
minecraft_version=26.2
# 最新セルなので上限開放。26.3 セルを足す時にここを [26.2,26.3) へ閉じる。
minecraft_version_range=[26.2,)
neo_version=26.2.0.28-beta
# NeoForge 本体はパッチまで切らずマイナーで止める (beta のパッチ番号で切ると無駄に競合する)
neo_version_range=[26.2,)
loader_version_range=[1,)

## Mod Properties
mod_id=welcome_board
mod_name=Welcome Board
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.kuronami.welcomeboard
mod_authors=KURONAMI
mod_description=Show a welcome or update screen to players joining your modpack. No extra mods required.
